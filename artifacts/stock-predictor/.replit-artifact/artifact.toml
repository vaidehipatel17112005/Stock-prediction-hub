kind = "web"
previewPath = "/"
title = "AI Stock Price Predictor"
version = "1.0.0"
id = "artifacts/stock-predictor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21095

[services.development]
run = "pnpm --filter @workspace/stock-predictor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-predictor", "run", "build" ]
serve = "static"
publicDir = "artifacts/stock-predictor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21095"
BASE_PATH = "/"
